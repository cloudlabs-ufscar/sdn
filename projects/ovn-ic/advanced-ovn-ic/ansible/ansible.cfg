# =============================================================================
# ansible.cfg — read automatically when you run ansible from THIS directory.
# It saves you from passing the same flags on every command.
# NOTE: in INI files comments must be on their OWN line (no trailing "# ..."
# after a value, or Ansible reads the comment as part of the value).
# =============================================================================
[defaults]
# default inventory file (the list of hosts)
inventory = inventory.ini
# where to find roles
roles_path = roles
# don't prompt to accept SSH host keys (lab convenience)
host_key_checking = False
# human-readable, multi-line task output (modern replacement for the old
# stdout_callback=yaml, which was removed from community.general 12+)
callback_result_format = yaml
# skip Python auto-discovery noise
interpreter_python = /usr/bin/python3
nocows = True
# how many hosts to act on in parallel
forks = 10

[ssh_connection]
# pipelining sends fewer SSH round-trips per task (big speed-up). It works here
# because sudo is passwordless on both VMs (no 'requiretty').
pipelining = True
# Reuse one SSH connection per host instead of reconnecting per task.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s
