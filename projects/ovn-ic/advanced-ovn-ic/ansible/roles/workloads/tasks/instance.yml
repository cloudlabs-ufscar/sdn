---
# Per-container lifecycle (called once per workload, with loop_var `wl`).
# The launch/device tasks are made idempotent by tolerating "already exists".

- name: Resolve the NIC that carries the default route for {{ wl.name }}
  ansible.builtin.set_fact:
    wl_default_nic: "{{ wl.nics | selectattr('default_route', 'equalto', true) | first }}"

- name: Launch container {{ wl.name }}
  become: true
  ansible.builtin.command:
    cmd: incus launch images:ubuntu/24.04 {{ wl.name }} -p ovn
  register: launch
  changed_when: launch.rc == 0
  failed_when: launch.rc != 0 and 'already exists' not in (launch.stderr | lower)

# nictype=p2p: Incus only builds the veth pair (container side = the named iface
# with our MAC and MTU; host side = host_iface, left unbridged). We do the OVS
# plumbing ourselves below, instead of relying on Incus's native OVS client
# (which fails to talk to the OVS db on Incus 6.0). This matches the lab's "OVN
# driven manually, Incus only provides the workload" design.
#
# One device per plane the workload lives on: app backends get two, db-vm one.
- name: Attach a p2p veth to {{ wl.name }} for each plane
  become: true
  ansible.builtin.command:
    cmd: >
      incus config device add {{ wl.name }} {{ item.iface }} nic
      nictype=p2p name={{ item.iface }} host_name={{ item.host_iface }}
      hwaddr={{ item.mac }} mtu={{ overlay_mtu }}
  loop: "{{ wl.nics }}"
  loop_control:
    label: "{{ wl.name }}/{{ item.iface }} ({{ item.plane }} {{ item.ip }})"
  register: nicadd
  changed_when: nicadd.rc == 0
  failed_when: nicadd.rc != 0 and 'already exists' not in (nicadd.stderr | lower)

- name: Plug each host veth of {{ wl.name }} into br-int with its OVN iface-id
  become: true
  ansible.builtin.shell:
    cmd: |
      ip link set {{ item.host_iface }} up
      ovs-vsctl --may-exist add-port br-int {{ item.host_iface }} \
        -- set interface {{ item.host_iface }} external_ids:iface-id={{ item.lsp }}
  loop: "{{ wl.nics }}"
  loop_control:
    label: "{{ item.host_iface }} -> {{ item.lsp }}"
  changed_when: false

- name: Render the static netplan for {{ wl.name }}
  ansible.builtin.template:
    src: netplan-ovn.yaml.j2
    dest: /tmp/netplan-{{ wl.name }}.yaml
    mode: "0600"

- name: Push the netplan into {{ wl.name }}
  become: true
  ansible.builtin.command:
    cmd: >
      incus file push /tmp/netplan-{{ wl.name }}.yaml
      {{ wl.name }}/etc/netplan/90-ovn.yaml --mode 0600 --uid 0 --gid 0
  changed_when: false

- name: Remove the default DHCP netplan in {{ wl.name }}
  become: true
  ansible.builtin.command:
    cmd: incus exec {{ wl.name }} -- rm -f /etc/netplan/10-cloud-init.yaml /etc/netplan/50-cloud-init.yaml
  changed_when: false

- name: Apply the static network config in {{ wl.name }}
  become: true
  ansible.builtin.command:
    cmd: incus exec {{ wl.name }} -- netplan apply
  changed_when: false

- name: Wait until every NIC of {{ wl.name }} can reach its plane gateway
  become: true
  ansible.builtin.command:
    cmd: >
      incus exec {{ wl.name }} -- ping -c1 -W2 -I {{ item.iface }}
      {{ plane_map[item.plane].gw }}
  loop: "{{ wl.nics }}"
  loop_control:
    label: "{{ wl.name }}/{{ item.iface }} -> {{ plane_map[item.plane].gw }}"
  register: gwping
  retries: 15
  delay: 2
  until: gwping.rc == 0
  changed_when: false

- name: Wait until {{ wl.name }} can reach the internet via its plane's OVN SNAT
  become: true
  ansible.builtin.command:
    cmd: incus exec {{ wl.name }} -- ping -c1 -W3 1.1.1.1
  register: netping
  retries: 15
  delay: 2
  until: netping.rc == 0
  changed_when: false
