---
# =============================================================================
# role: ovn_chassis
# Turns THIS VM into an OVN chassis and wires up north-south connectivity.
#
#   1. Configure OVS (system-id, ovn-remote, GENEVE encap-ip, interconn flag,
#      bridge mapping for the external network).
#   2. Run ovn-controller (it auto-creates br-int and binds logical ports).
#   3. Create an external OVS bridge (br-ex) with a host gateway IP, enable
#      forwarding and MASQUERADE so the OVN routers can reach the internet.
#   4. Open the firewall between the two chassis (GENEVE + IC databases).
# =============================================================================

- name: Resolve ovn-controller path
  ansible.builtin.shell:
    cmd: "command -v ovn-controller"
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: ovnctl_bin
  changed_when: false

# external_ids:ovn-encap-ip is the GENEVE tunnel source. We use the private
# interface IP because (as we verified) the two VMs route to each other on it.
# ovn-is-interconn=true is what makes ovn-ic register this chassis as a gateway.
- name: Configure the OVS chassis
  become: true
  ansible.builtin.command:
    cmd: >
      ovs-vsctl set open_vswitch .
      external_ids:system-id={{ chassis_name }}
      external_ids:ovn-remote=tcp:127.0.0.1:{{ sb_port }}
      external_ids:ovn-encap-type=geneve
      external_ids:ovn-encap-ip={{ az_private_ip }}
      external_ids:ovn-is-interconn=true
      external_ids:ovn-bridge-mappings=physnet-ext:{{ ext_bridge }}
  changed_when: false        # ovs-vsctl set is idempotent in effect

- name: Create the external OVS bridge (br-ex)
  become: true
  ansible.builtin.command:
    cmd: ovs-vsctl --may-exist add-br {{ ext_bridge }}
  changed_when: false

# The host owns .1 on br-ex; the cell's edge gateway router owns .2 (client SNAT)
# and .3 (mgmt SNAT) and ARPs for this address as its next hop.
# `ip addr replace` is idempotent (adds or updates). Not reboot-persistent:
# re-running this playbook re-applies it, which is fine for a lab.
- name: Bring up br-ex and give the host its gateway IP on it
  become: true
  ansible.builtin.shell:
    cmd: |
      ip link set {{ ext_bridge }} up
      ip addr replace {{ ext_host_ip }}/24 dev {{ ext_bridge }}
  changed_when: false

- name: Install the ovn-controller systemd unit
  become: true
  ansible.builtin.template:
    src: ovn-controller.service.j2
    dest: /etc/systemd/system/ovn-controller.service
    mode: "0644"
  notify: reload systemd

- name: Apply pending systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start ovn-controller
  become: true
  ansible.builtin.systemd_service:
    name: ovn-controller
    enabled: true
    state: started

- name: Wait for ovn-controller to create br-int
  become: true
  ansible.builtin.command: ovs-vsctl br-exists br-int
  register: brint
  retries: 10
  delay: 2
  until: brint.rc == 0
  changed_when: false

# --- North-south plumbing on the host ---------------------------------------
- name: Enable IPv4 forwarding on the host
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# The edge router SNATs each plane to its own address in ext_cidr; this rule then
# MASQUERADEs that whole external subnet out the real uplink (ens3). Two NATs, but
# it keeps ens3 untouched so SSH/Ansible never break.
- name: MASQUERADE the external subnet out the uplink (host-level SNAT)
  become: true
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ ext_cidr }}"
    out_interface: "{{ ansible_facts.default_ipv4.interface }}"
    jump: MASQUERADE
    comment: "advanced-ovn-ic: host SNAT for OVN external subnet"

- name: Allow forwarding br-ex -> uplink
  become: true
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ ext_bridge }}"
    out_interface: "{{ ansible_facts.default_ipv4.interface }}"
    jump: ACCEPT
    comment: "advanced-ovn-ic: forward out"

- name: Allow return traffic uplink -> br-ex
  become: true
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ ansible_facts.default_ipv4.interface }}"
    out_interface: "{{ ext_bridge }}"
    ctstate: ["RELATED", "ESTABLISHED"]
    jump: ACCEPT
    comment: "advanced-ovn-ic: forward return"

# --- Firewall between the two chassis ---------------------------------------
- name: Determine the peer AZ's private IP
  ansible.builtin.set_fact:
    peer_private_ip: "{{ hostvars[(groups['azs'] | difference([inventory_hostname]))[0]].az_private_ip }}"

- name: Allow GENEVE (UDP 6081) from the peer AZ
  become: true
  community.general.ufw:
    rule: allow
    proto: udp
    port: "6081"
    src: "{{ peer_private_ip }}"
    comment: "advanced-ovn-ic: GENEVE from peer"
  failed_when: false          # harmless if ufw is inactive/absent

# Every IC cluster member must reach every other one, on both the client ports
# and the RAFT peer ports.
- name: Allow the IC cluster ports from every other cluster member
  become: true
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item.1 }}"
    src: "{{ hostvars[item.0].az_private_ip }}"
    comment: "advanced-ovn-ic: IC cluster from {{ item.0 }}"
  loop: "{{ groups['ic_cluster'] | difference([inventory_hostname]) | product([ic_nb_port, ic_sb_port, ic_nb_raft_port, ic_sb_raft_port]) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
  failed_when: false

# --- Host telemetry ----------------------------------------------------------
# node_exporter on the AZ host is where the interconnect becomes measurable: its
# per-interface counters include genev_sys_6081, so tunnel bytes/s is a real
# metric rather than an inference.
- name: Install node_exporter on the AZ host
  become: true
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false

- name: Bind node_exporter to this AZ's private address
  become: true
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      ARGS="--web.listen-address={{ az_private_ip }}:{{ node_exporter_port }}"
  notify: restart node exporter

- name: Enable node_exporter on the AZ host
  become: true
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

# --- Infrastructure probe agent ----------------------------------------------
# Answers the dashboard's "Testar" buttons with live OVN state. It has to run on
# the HOST: transit switches, learned routes, GENEVE tunnels and the RAFT cluster
# exist only in the local OVN databases and OVS, which no workload can reach.
- name: Install the infrastructure probe agent
  become: true
  ansible.builtin.copy:
    src: infra_probe.py
    dest: "{{ lab_dir }}/infra_probe.py"
    mode: "0755"

- name: Render the probe agent's per-plane expectations
  become: true
  ansible.builtin.copy:
    dest: "{{ lab_dir }}/infra_probe_planes.json"
    mode: "0644"
    content: "{{ probe_planes | to_nice_json }}"
  vars:
    probe_planes: "{{ [
      {'name': 'client',
       'lr': (planes | selectattr('name','equalto','client') | map(attribute='lr') | first),
       'ts': (planes | selectattr('name','equalto','client') | map(attribute='ts') | first),
       'peer_cidr': (hostvars[(groups['azs'] | difference([inventory_hostname]))[0]].planes
                     | selectattr('name','equalto','client') | map(attribute='cidr') | first),
       'other_prefix': '10.20.'},
      {'name': 'mgmt',
       'lr': (planes | selectattr('name','equalto','mgmt') | map(attribute='lr') | first),
       'ts': (planes | selectattr('name','equalto','mgmt') | map(attribute='ts') | first),
       'peer_cidr': (hostvars[(groups['azs'] | difference([inventory_hostname]))[0]].planes
                     | selectattr('name','equalto','mgmt') | map(attribute='cidr') | first),
       'other_prefix': '10.10.'}
    ] }}"

- name: Install the probe agent systemd unit
  become: true
  ansible.builtin.template:
    src: infra-probe.service.j2
    dest: /etc/systemd/system/infra-probe.service
    mode: "0644"
  notify: reload systemd

- name: Apply pending systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the probe agent
  become: true
  ansible.builtin.systemd_service:
    name: infra-probe
    enabled: true
    state: restarted

# Only the MANAGEMENT plane may ask the infrastructure about itself: workloads
# route to the underlay through their mgmt NIC, so locally the agent sees the
# mgmt plane's SNAT address and nothing else gets in.
#
# Honest caveat: traffic from the PEER AZ arrives after that host's MASQUERADE,
# so it carries the peer's underlay address and the client/mgmt distinction is
# lost for it. The rule below is therefore exact locally and coarse remotely.
- name: Allow the probe port only from the mgmt plane and the peer AZ
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ infra_probe_port }}"
    source: "{{ item }}"
    jump: ACCEPT
    action: insert
    comment: "advanced-ovn-ic: infra probe from {{ item }}"
  loop:
    - "{{ (planes | selectattr('name', 'equalto', 'mgmt') | first).snat_ip }}"
    - "{{ hostvars[(groups['azs'] | difference([inventory_hostname]))[0]].az_private_ip }}"

- name: Allow node_exporter only from the mgmt plane and the peer AZ
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ node_exporter_port }}"
    source: "{{ item }}"
    jump: ACCEPT
    action: insert
    comment: "advanced-ovn-ic: node exporter from {{ item }}"
  loop:
    - "{{ (planes | selectattr('name', 'equalto', 'mgmt') | first).snat_ip }}"
    - "{{ hostvars[(groups['azs'] | difference([inventory_hostname]))[0]].az_private_ip }}"

- name: Drop any other access to the node exporter port
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ node_exporter_port }}"
    jump: DROP
    action: append
    comment: "advanced-ovn-ic: node exporter default deny"

- name: Drop any other access to the probe port
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ infra_probe_port }}"
    jump: DROP
    action: append
    comment: "advanced-ovn-ic: infra probe default deny"
