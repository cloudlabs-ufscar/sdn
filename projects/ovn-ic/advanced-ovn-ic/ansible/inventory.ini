# =============================================================================
# inventory.ini — WHO Ansible manages.
#
# "az1" and "az2" are the SSH aliases you already defined in ~/.ssh/config
# (HostName 201.23.73.63 / 201.23.74.156, User ubuntu, your key). Ansible's SSH
# transport reads that same config, so it connects exactly like `ssh az1` does.
#
# [azs]      -> a group containing both VMs.
# [ic_host]  -> the single VM that also hosts the global IC-NB/IC-SB databases.
# =============================================================================
[azs]
az1
az2

[ic_host]
az1

[azs:vars]
ansible_user = ubuntu
