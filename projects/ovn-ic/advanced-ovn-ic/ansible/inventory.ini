# =============================================================================
# inventory.ini — WHO Ansible manages.
#
# "az1", "az2" and "quorum" are the SSH aliases you already defined in
# ~/.ssh/config. Ansible's SSH transport reads that same config, so it connects
# exactly like `ssh az1` does.
#
# [azs]        -> the two real availability zones: chassis, workloads, GENEVE.
# [ic_cluster] -> the three nodes running the global IC-NB/IC-SB RAFT cluster.
#                 az1 and az2 are AZs that also carry a cluster member; the
#                 quorum node is an ARBITER ONLY — it runs no chassis, no br-int
#                 and no GENEVE, it exists purely to make the cluster an odd
#                 number so it can survive losing one member.
# =============================================================================
[azs]
az1
az2

[ic_cluster]
az1
az2
quorum

[all:vars]
ansible_user = ubuntu
